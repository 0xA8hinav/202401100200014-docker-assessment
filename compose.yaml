services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: festpass
      POSTGRES_DB: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - back-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${DB_PASSWORD}
      REGNO: ${REGNO}
      APP_VERSION: dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back-net
      - front-net

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "${PORT}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - front-net

networks:
  front-net:
  back-net:

volumes:
  db-data:
